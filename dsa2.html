<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<script>
  // Apply saved theme instantly (no flash)
  (function() {
    const root = document.documentElement;
    const saved = localStorage.getItem('theme');
    const isDark = saved
      ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) root.classList.add('dark');
  })();
</script>
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f3f1;
  --surface:#f8f8f6;
  --surface-2:#eceae5;
  --text:#1c1f1d;
  --text-soft:#565f5a;
  --text-faint:#8a9089;
  --border:#dfe1dc;
  --accent:#2c5f52;
  --accent-soft:#dfe9e4;
  --accent-text:#1f4238;
  --radius: 3px;
  color-scheme: light;
}
html.dark{
  --bg:#070b14;
  --surface:#0d1524;
  --surface-2:#101d33;
  --text:#eaf3ff;
  --text-soft:#a9bbd8;
  --text-faint:#7d8eaf;
  --border:#1d2d47;
  --accent:#60a5fa;
  --accent-soft:#10213d;
  --accent-text:#dceeff;
  --formula-bg:#101a2d;
  --formula-border:#8ab4ff;
  --code-bg:#101b2d;
  --mark-bg:#3b5d9c;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans', sans-serif;
  line-height:1.45;
  transition:background .25s ease, color .25s ease;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 30px 16px;
}

.container{
  max-width: 480px;
  width: 100%;
  text-align: center;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.brand{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.04em;
  color:var(--text-faint);
  text-transform: uppercase;
}
.brand strong{
  display:block;
  font-family:'Newsreader', serif;
  font-size:22px;
  color:var(--text);
  font-weight:500;
  text-transform: none;
  margin-top:2px;
  line-height: 1.1;
}

#themeToggle{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  width:32px;
  height:32px;
  border-radius:var(--radius);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition: background .15s ease;
}
#themeToggle:hover{ background:var(--accent-soft); }
#themeToggle svg{ width:15px; height:15px; }

.card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s ease;
}
.card:hover{
  border-color: var(--accent);
}

.title{
  font-family: 'Newsreader', serif;
  font-size: 32px;
  font-weight: 500;
  margin: 0 0 12px 0;
  color: var(--text);
}

.signature{
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  margin: 0;
}

.footer{
  margin-top: 20px;
  font-size: 12px;
  color: var(--text-faint);
}

.footer a{
  color: var(--accent-text);
  text-decoration: none;
  border-bottom: 1px dashed var(--border);
}
.footer a:hover{
  border-bottom-color: var(--accent);
}
</style>
<style>
:root{--bg:#f3f3f1;--surface:#f8f8f6;--surface-2:#eceae5;--text:#1c1f1d;--text-soft:#565f5a;--text-faint:#8a9089;--border:#dfe1dc;--accent:#2c5f52;--accent-soft:#dfe9e4;--accent-text:#1f4238;}
html.dark{--bg:#070b14;--surface:#0d1524;--surface-2:#101d33;--text:#eaf3ff;--text-soft:#a9bbd8;--text-faint:#7d8eaf;--border:#1d2d47;--accent:#60a5fa;--accent-soft:#10213d;--accent-text:#dceeff;}
.home-link{position:fixed;right:18px;bottom:18px;z-index:700;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:500 12px 'IBM Plex Mono',monospace;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.home-link:hover{background:var(--accent-soft);color:var(--accent-text);}
@media (max-width:600px){.home-link{right:12px;bottom:12px;padding:7px 10px;}}
</style>
<style>
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px;padding-top:14px;border-top:1px solid var(--border);color:var(--text-faint);font:12px 'IBM Plex Mono',monospace;}
.site-footer a{color:var(--accent-text);text-decoration:none;}
.site-footer a:hover{color:var(--accent);}
@media (max-width:600px){.site-footer{align-items:flex-start;flex-direction:column;gap:6px;}}
.site-header{border-color:var(--border);color:var(--text);}
.site-header.masthead{padding-bottom:20px;border-bottom:1px solid var(--border);}
.site-header.topbar{background:var(--bg-elevated, var(--surface));border-bottom:1px solid var(--border);}
.site-header.sidebar-head{border-bottom:1px solid var(--border);padding-bottom:14px;}
</style>
</head>
<body>
<a class="home-link" href="index.html" aria-label="Back to home">&larr; Home</a>

<div class="container">
  <header class="site-header">
    <div class="brand">
      Reference Portal
      <strong>Coming Soon</strong>
    </div>
    <button id="themeToggle" aria-label="Toggle theme">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <div class="card">
    <h1 class="title">Coming Soon</h1>
    <p class="signature">-TYN</p>
  </div>

  <footer class="site-footer"><span>TYN Notes · Data Structures &amp; Algorithms</span><a href="index.html">Home</a></footer>
</div>

<script>
// Theme Toggle with localStorage persistence
const root = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const iconSun = document.getElementById('iconSun');

const sunIcon = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>';

function applyTheme(dark) {
  root.classList.toggle('dark', dark);
  iconSun.innerHTML = dark ? moonIcon : sunIcon;
}

// Determine initial theme: saved preference or system preference
const savedTheme = localStorage.getItem('theme');
let isDark = savedTheme
  ? savedTheme === 'dark'
  : window.matchMedia('(prefers-color-scheme: dark)').matches;

applyTheme(isDark);

themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  applyTheme(isDark);
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});
</script>
</body>
</html>
