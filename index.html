<script>
  (function() {
    const root = document.documentElement;
    const saved = localStorage.getItem('theme');
    const isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) {
      root.classList.add('dark');
      root.setAttribute('data-theme', 'dark');
    } else {
      root.classList.remove('dark');
      root.setAttribute('data-theme', 'light');
    }
  })();
</script>

.grid{

}

.card{

  border-radius: var(--radius);

  display: flex;

  justify-content: space-between;
  transition: border-color 0.15s ease;
}
.card:hover{

}

.card-head{

  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 6px;
}
.code{

  font-size: 10px;

  border-radius: 2px;

.title{

  color: var(--text);
}

.unit-btns{

  gap: 8px;
  margin-top: auto;
}

.unit-btn{

.unit-btn:hover{

.unit-btn svg{

}
.unit-btn:hover svg{

  transform: translateX(2px);
}

<script>
// Theme Toggle with localStorage persistence
const root = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const iconSun = document.getElementById('iconSun');

const sunIcon = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>';

function applyTheme(dark) {
  root.classList.toggle('dark', dark);
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  if (iconSun) iconSun.innerHTML = dark ? moonIcon : sunIcon;
}

// Determine initial theme: saved preference or system preference
const savedTheme = localStorage.getItem('theme');
let isDark = savedTheme
  ? savedTheme === 'dark'
  : window.matchMedia('(prefers-color-scheme: dark)').matches;

applyTheme(isDark);

themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  applyTheme(isDark);
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});
</script>
<script>document.body.appendChild(document.getElementById('themeToggle'));</script>
