<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var root = document.documentElement;
      var saved = localStorage.getItem('theme');
      var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) {
        root.classList.add('dark');
        root.setAttribute('data-theme', 'dark');
      } else {
        root.classList.remove('dark');
        root.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>C Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" crossorigin="anonymous">
  <style>
    :root {
      --bg: #f3f3f1;
      --bg-elev: #f8f8f6;
      --ink: #1c1f1d;
      --ink-soft: #565f5a;
      --ink-faint: #8a9089;
      --border: #dfe1dc;
      --code-bg: #101b2d;
      --code-ink: #eaf3ff;
      --accent: #2c5f52;
      --accent-soft: #dfe9e4;
      --radius: 3px;
    }

    :root[data-theme="dark"] {
      --bg: #070b14;
      --bg-elev: #0d1524;
      --ink: #eaf3ff;
      --ink-soft: #a9bbd8;
      --ink-faint: #7d8eaf;
      --border: #1d2d47;
      --code-bg: #101b2d;
      --code-ink: #eaf3ff;
      --accent: #60a5fa;
      --accent-soft: #10213d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    .dsa-playground {
      width: 100%;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-elev);
      overflow: hidden;
    }

    .dsa-playground-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dsa-playground-title {
      font: 600 13px 'IBM Plex Mono', monospace;
      color: var(--ink);
    }

    .dsa-playground-meta {
      font-size: 12px;
      color: var(--ink-faint);
    }

    .dsa-playground-close {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 9px;
      background: var(--bg);
      color: var(--ink);
      font: 500 12px 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .dsa-playground-close:hover {
      background: var(--accent-soft);
    }

    /* Resizable Split */
    .dsa-split {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .dsa-split-editor {
      flex: 4 1 0;
      min-height: 120px;
      display: flex;
      min-width: 0;
      position: relative;
    }

    .dsa-split-terminal {
      flex: 1 1 0;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    /* Editor */
    .dsa-playground-editor {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      resize: none;
      overflow: auto;
      box-sizing: border-box;
      padding: 14px;
      border: 0;
      outline: none;
      background: var(--code-bg);
      color: var(--code-ink);
      font: 13px/1.6 'IBM Plex Mono', monospace;
      tab-size: 4;
    }

    .dsa-playground-editor:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    /* Controls Toolbar */
    .dsa-playground-controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-elev);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .dsa-playground-controls button {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 10px;
      background: var(--bg);
      color: var(--ink);
      font: 500 12px 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .dsa-playground-controls button:hover {
      background: var(--accent-soft);
    }

    .dsa-playground-controls .run {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    /* Drag Handle */
    .dsa-split-handle {
      flex: 0 0 auto;
      height: 12px;
      cursor: row-resize;
      position: relative;
      touch-action: none;
      background: var(--bg-elev);
      z-index: 5;
    }

    .dsa-split-handle::before {
      content: "";
      position: absolute;
      inset: 50% 16px auto 16px;
      height: 2px;
      transform: translateY(-50%);
      background: var(--border);
      border-radius: 2px;
      transition: background .15s, opacity .15s;
    }

    .dsa-split-handle:hover::before,
    .dsa-split-handle:focus-visible::before {
      background: var(--accent);
    }

    .dsa-split-handle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    /* Global cursor & selection during drag */
    body.dsa-resizing,
    body.dsa-resizing * {
      cursor: row-resize !important;
      user-select: none !important;
    }

    /* Terminal inside split */
    .dsa-split-terminal .dsa-terminal {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      border-top: 0;
      background: var(--code-bg);
    }

    .dsa-split-terminal .dsa-terminal-head {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      color: var(--ink-faint);
      font: 10px 'IBM Plex Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .dsa-split-terminal .dsa-terminal-screen {
      flex: 1 1 auto;
      min-height: 0;
      padding: 8px 10px;
      background: #080d17;
      overflow: hidden;
    }

    .dsa-split-terminal .dsa-terminal-screen .xterm {
      height: 100%;
      padding: 4px;
    }

    .dsa-split-terminal .dsa-terminal-screen .xterm-viewport {
      overflow-y: auto !important;
    }

    @media (max-width:640px) {
      .dsa-playground-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .dsa-playground-controls {
        align-items: stretch;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <section class="dsa-playground" id="dsaPlayground">
    <div class="dsa-playground-head">
      <span class="dsa-playground-title">C Playground</span>
      <button class="dsa-playground-close" id="dsaClose" type="button">Close</button>
    </div>

    <div class="dsa-split" id="dsaSplit">
      <div class="dsa-split-pane dsa-split-editor">
        <textarea class="dsa-playground-editor" id="dsaCode" spellcheck="false">#include &lt;stdio.h&gt;

int main() {
  int queue[5], rear = -1, front = -1, count = 0, value, choice;
  while (1) {
    printf("\n1. Enqueue\n2. Dequeue\n3. Display\n4. Exit\nEnter your choice: "); fflush(stdout);
    scanf("%d", &amp;choice);
    if (choice == 1) { printf("Enter value: "); fflush(stdout); scanf("%d", &amp;value); if (count &lt; 5) { if (front == -1) front = 0; rear = (rear + 1) % 5; queue[rear] = value; count++; } }
    else if (choice == 2) { if (count == 0) printf("Queue is empty\n"); else { printf("Dequeued value: %d\n", queue[front]); front = (front + 1) % 5; count--; } }
    else if (choice == 3) { for (int i = 0; i &lt; count; i++) printf("%d ", queue[(front + i) % 5]); printf("\n"); }
    else break;
  }
  return 0;
}</textarea>
      </div>

      <div class="dsa-playground-controls">
        <button class="run" id="dsaRun" type="button">Run</button>
        <button id="dsaStop" type="button">Stop</button>
        <button id="dsaReset" type="button">Reset</button>
        <span id="dsaStatus" class="dsa-playground-meta"></span>
      </div>

      <div class="dsa-split-handle" id="dsaSplitHandle" role="separator" aria-orientation="horizontal"
        aria-label="Resize code editor and terminal" title="Drag to resize" tabindex="0"></div>

      <div class="dsa-split-pane dsa-split-terminal">
        <div class="dsa-terminal">
          <div class="dsa-terminal-head">
            <span>Interactive Terminal</span><span>C · In-Browser WebAssembly</span>
          </div>
          <div class="dsa-terminal-screen" id="dsaTerminal" aria-label="Interactive C terminal"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      var editor = document.getElementById('dsaCode');
      var runButton = document.getElementById('dsaRun');
      var stopButton = document.getElementById('dsaStop');
      var resetButton = document.getElementById('dsaReset');
      var statusEl = document.getElementById('dsaStatus');
      var closeButton = document.getElementById('dsaClose');

      var terminal = new Terminal({
        cursorBlink: true, convertEol: true, disableStdin: false,
        fontFamily: 'IBM Plex Mono, monospace', fontSize: 13,
        theme: { background: '#080d17', foreground: '#eaf3ff', cursor: '#60a5fa', selectionBackground: '#1e3a5f' }
      });

      var fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(document.getElementById('dsaTerminal'));

      function fitTerminal() { try { fitAddon.fit(); } catch (e) { } }
      function writeLines(text) { if (!text) return; terminal.write(String(text).replace(/\n/g, '\r\n')); }
      function status(text) { if (statusEl) statusEl.textContent = text || ''; }

      terminal.writeln('\x1b[36m=== C Interactive Terminal ===\x1b[0m');
      terminal.writeln('\x1b[90mPress Run, then type input and press Enter.\x1b[0m\r\n');
      fitTerminal();

      closeButton.addEventListener('click', function () {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'close-playground' }, '*');
        }
      });

      /* ================= Worker-based C Engine ================= */
      var isRunning = false;
      var activeWorker = null;
      var lineInputBuffer = '';
      var jsCppSource = '';
      var traceurSource = '';

      // Fetch JSCPP source in main thread, then embed in worker blob
      Promise.all([
        fetch('https://cdn.jsdelivr.net/npm/JSCPP@latest/dist/JSCPP.es5.min.js').then(function (r) { return r.text(); }),
        fetch('https://cdn.jsdelivr.net/npm/traceur@0.0.111/bin/traceur-runtime.js').then(function (r) { return r.text(); })
      ]).then(function (sources) {
        jsCppSource = sources[0];
        traceurSource = sources[1];
      }).catch(function () {
        terminal.writeln('\x1b[91m[Error] Failed to load JSCPP. Check your internet connection.\x1b[0m');
      });

      function buildWorkerBlobUrl() {
        var workerCode = `
      ${traceurSource}
      ${jsCppSource}

      var stdinBuffer = '';

      self.onmessage = function(e){
        var msg = e.data;
        if(msg.type === 'run'){ runCode(msg.code); }
        else if(msg.type === 'stdin_data'){ stdinBuffer += msg.data; }
      };

      function runCode(code){
        try {
          var custom_stdio = {
            load: function(rt){
              var char_pointer = rt.normalPointerType(rt.charTypeLiteral);

              var _printf = function(rt, _this, formatVar){
                var params = Array.prototype.slice.call(arguments, 3);
                var formatStr = rt.getStringFromCharArray(formatVar);
                var paramIdx = 0;
                var out = '';
                for(var i = 0; i < formatStr.length; i++){
                  if(formatStr[i] === '%' && i + 1 < formatStr.length){
                    var spec = formatStr[i + 1];
                    if(spec === '%'){ out += '%'; i++; continue; }
                    var p = params[paramIdx++];
                    if(spec === 'd' || spec === 'i' || spec === 'u' || spec === 'x' || spec === 'X'){
                      out += String(p && p.v != null ? p.v : 0);
                    } else if(spec === 'f'){
                      out += String(p && p.v != null ? p.v : 0);
                    } else if(spec === 's'){
                      out += p ? (rt.isStringType(p.t) || rt.isArrayType(p.t) || rt.isNormalPointerType(p.t) ? rt.getStringFromCharArray(p) : String(p.v)) : '';
                    } else if(spec === 'c'){
                      out += p ? (typeof p.v === 'number' ? String.fromCharCode(p.v) : String(p.v)) : '';
                    } else if(spec === 'p'){
                      out += '0x' + (p && p.v != null ? p.v.toString(16) : '0');
                    } else { out += '%' + spec; }
                    i++;
                  } else { out += formatStr[i]; }
                }
                self.postMessage({ type: 'stdout', data: out });
                return rt.val(rt.intTypeLiteral, out.length);
              };

              var _scanf = function(rt, _this, formatVar){
                var args = Array.prototype.slice.call(arguments, 3);
                var formatStr = rt.getStringFromCharArray(formatVar);
                var re = /%([dicsfuxX])/g;
                var match;
                var argIdx = 0;
                var matchedCount = 0;

                while((match = re.exec(formatStr)) !== null && argIdx < args.length){
                  while(stdinBuffer.trim().length === 0){
                    self.postMessage({ type: 'stdin_request' });
                    return rt.val(rt.intTypeLiteral, matchedCount);
                  }
                  var trimmed = stdinBuffer.trimStart();
                  var spec = match[1];
                  var targetPtr = args[argIdx++];

                  if(spec === 'd' || spec === 'i' || spec === 'u' || spec === 'x' || spec === 'X'){
                    var numMatch = trimmed.match(/^([-+]?[0-9]+)/);
                    if(numMatch){
                      var num = parseInt(numMatch[1], 10);
                      stdinBuffer = trimmed.slice(numMatch[1].length);
                      if(targetPtr && targetPtr.v && targetPtr.v.target){ targetPtr.v.target.v = num; }
                      matchedCount++;
                    } else { break; }
                  } else if(spec === 'f'){
                    var floatMatch = trimmed.match(/^([-+]?[0-9]*\\.?[0-9]+)/);
                    if(floatMatch){
                      var fnum = parseFloat(floatMatch[1]);
                      stdinBuffer = trimmed.slice(floatMatch[1].length);
                      if(targetPtr && targetPtr.v && targetPtr.v.target){ targetPtr.v.target.v = fnum; }
                      matchedCount++;
                    } else { break; }
                  } else if(spec === 's'){
                    var strMatch = trimmed.match(/^(\\S+)/);
                    if(strMatch){
                      var strVal = strMatch[1];
                      stdinBuffer = trimmed.slice(strVal.length);
                      if(targetPtr && targetPtr.v && targetPtr.v.target){
                        var arr = rt.makeCharArrayFromString(strVal);
                        for(var j = 0; j < arr.v.target.length; j++){ targetPtr.v.target[j] = arr.v.target[j]; }
                      }
                      matchedCount++;
                    } else { break; }
                  } else if(spec === 'c'){
                    if(stdinBuffer.length > 0){
                      var ch = stdinBuffer[0];
                      stdinBuffer = stdinBuffer.slice(1);
                      if(targetPtr && targetPtr.v && targetPtr.v.target){ targetPtr.v.target.v = ch.charCodeAt(0); }
                      matchedCount++;
                    }
                  }
                }
                return rt.val(rt.intTypeLiteral, matchedCount);
              };

              var _getchar = function(rt){
                while(stdinBuffer.length === 0){
                  self.postMessage({ type: 'stdin_request' });
                  return rt.val(rt.intTypeLiteral, -1);
                }
                var code = stdinBuffer.charCodeAt(0);
                stdinBuffer = stdinBuffer.slice(1);
                return rt.val(rt.intTypeLiteral, code);
              };

              var _putchar = function(rt, _this, ch){
                self.postMessage({ type: 'stdout', data: String.fromCharCode(ch.v) });
                return ch;
              };

              var _puts = function(rt, _this, strVar){
                var s = rt.getStringFromCharArray(strVar);
                self.postMessage({ type: 'stdout', data: s + '\\n' });
                return rt.val(rt.intTypeLiteral, s.length + 1);
              };

              var _fflush = function(rt){ return rt.val(rt.intTypeLiteral, 0); };

              rt.regFunc(_printf, 'global', 'printf', [char_pointer, '?'], rt.intTypeLiteral);
              rt.regFunc(_scanf, 'global', 'scanf', [char_pointer, '?'], rt.intTypeLiteral);
              rt.regFunc(_getchar, 'global', 'getchar', [], rt.intTypeLiteral);
              rt.regFunc(_putchar, 'global', 'putchar', [rt.intTypeLiteral], rt.intTypeLiteral);
              rt.regFunc(_puts, 'global', 'puts', [char_pointer], rt.intTypeLiteral);
              rt.regFunc(_fflush, 'global', 'fflush', ['?'], rt.intTypeLiteral);
            }
          };

          var myDebugger = JSCPP.run(code, '', {
            debug: true,
            includes: { 'stdio.h': custom_stdio, 'cstdio': custom_stdio },
            stdio: { write: function(s){ self.postMessage({ type: 'stdout', data: s }); } }
          });

          var done = false;
          while(!done){ done = myDebugger.next() || myDebugger.done; }

          self.postMessage({ type: 'exit', code: 0 });
        } catch(err){
          self.postMessage({ type: 'error', message: err.message || String(err) });
        }
      }
    `;

        var blob = new Blob([workerCode], { type: 'application/javascript' });
        return URL.createObjectURL(blob);
      }

      function terminateExecution(reason) {
        if (activeWorker) {
          try { activeWorker.terminate(); } catch (e) { }
          activeWorker = null;
        }
        isRunning = false;
        runButton.disabled = false;
        runButton.textContent = 'Run';
        if (reason) status(reason);
      }

      terminal.onData(function (data) {
        if (!isRunning) return;
        if (data === '\x03') {
          terminal.write('^C\r\n\x1b[93m[Process stopped by user]\x1b[0m\r\n');
          terminateExecution('stopped');
          return;
        }
        if (data === '\r') {
          terminal.write('\r\n');
          var fullLine = lineInputBuffer + '\n';
          lineInputBuffer = '';
          if (activeWorker) {
            activeWorker.postMessage({ type: 'stdin_data', data: fullLine });
          }
          return;
        }
        if (data === '\x7f' || data === '\b') {
          if (lineInputBuffer.length > 0) {
            lineInputBuffer = lineInputBuffer.slice(0, -1);
            terminal.write('\b \b');
          }
          return;
        }
        if (data.charCodeAt(0) === 27) return;
        lineInputBuffer += data;
        terminal.write(data);
      });

      runButton.addEventListener('click', function () {
        if (isRunning) return;
        if (!jsCppSource) {
          terminal.writeln('\x1b[91m[Error] JSCPP not loaded yet. Please wait and try again.\x1b[0m');
          return;
        }

        terminal.clear();
        terminal.write('\x1b[90mCompiling & running...\x1b[0m\r\n\r\n');
        status('running');
        isRunning = true;
        runButton.disabled = true;
        runButton.textContent = 'Running';
        lineInputBuffer = '';

        try {
          var blobUrl = buildWorkerBlobUrl();
          activeWorker = new Worker(blobUrl);

          activeWorker.onmessage = function (event) {
            var msg = event.data;
            if (msg.type === 'stdout') {
              writeLines(msg.data);
            } else if (msg.type === 'stdin_request') {
              status('waiting for input');
              terminal.focus();
            } else if (msg.type === 'exit') {
              terminal.write('\r\n\x1b[92m[Program finished successfully]\x1b[0m\r\n');
              terminateExecution('finished');
            } else if (msg.type === 'error') {
              terminal.write('\r\n\x1b[91m[Error]: ' + msg.message + '\x1b[0m\r\n');
              terminateExecution('error');
            }
          };

          activeWorker.onerror = function (err) {
            terminal.write('\r\n\x1b[91m[Runtime Error]: ' + (err.message || 'Worker execution failed') + '\x1b[0m\r\n');
            terminateExecution('error');
          };

          activeWorker.postMessage({ type: 'run', code: editor.value });
          terminal.focus();
        } catch (err) {
          terminal.write('\r\n\x1b[91m[Failed to launch]: ' + err.message + '\x1b[0m\r\n');
          terminateExecution('failed');
        }
      });

      stopButton.addEventListener('click', function () {
        if (isRunning) {
          terminal.write('\r\n\x1b[93m[Process stopped]\x1b[0m\r\n');
          terminateExecution('stopped');
        }
      });

      resetButton.addEventListener('click', function () {
        terminateExecution();
        editor.value = editor.defaultValue;
        lineInputBuffer = '';
        terminal.clear();
        terminal.writeln('\x1b[36m=== C Interactive Terminal ===\x1b[0m');
        terminal.writeln('\x1b[90mPress Run, then type input and press Enter.\x1b[0m\r\n');
        status('');
        fitTerminal();
      });

      editor.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); runButton.click(); }
        if (event.key === 'Tab') { event.preventDefault(); editor.setRangeText('    ', editor.selectionStart, editor.selectionEnd, 'end'); }
      });

      /* --- Resizable Split Controller --- */
      var split = document.getElementById('dsaSplit');
      if (split) {
        var handle = document.getElementById('dsaSplitHandle');
        var editorPane = split.querySelector('.dsa-split-editor');
        var termPane = split.querySelector('.dsa-split-terminal');
        var MIN_EDITOR = 120, MIN_TERM = 90, DEFAULT_EDITOR_SHARE = 0.75;

        function setEditorHeight(px, total) {
          if (total <= 0) return;
          var maxEditor = Math.max(MIN_EDITOR, total - MIN_TERM);
          var h = Math.min(Math.max(px, MIN_EDITOR), maxEditor);
          editorPane.style.flexGrow = String(h / total);
          termPane.style.flexGrow = String(1 - h / total);
          fitTerminal();
        }
        function measure() { return { editor: editorPane.getBoundingClientRect().height, term: termPane.getBoundingClientRect().height }; }
        function totalSpace() { var m = measure(); return m.editor + m.term; }
        function resetRatio() { var total = totalSpace(); setEditorHeight(total * DEFAULT_EDITOR_SHARE, total); }

        var drag = null;
        handle.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          var m = measure();
          drag = { id: e.pointerId, startY: e.clientY, startEditor: m.editor, total: m.editor + m.term };
          handle.setPointerCapture(e.pointerId);
          document.body.classList.add('dsa-resizing');
          e.preventDefault();
        });
        handle.addEventListener('pointermove', function (e) {
          if (!drag || e.pointerId !== drag.id) return;
          setEditorHeight(drag.startEditor + (e.clientY - drag.startY), drag.total);
        });
        function endDrag(e) {
          if (!drag || (e && e.pointerId !== drag.id)) return;
          if (handle.hasPointerCapture(drag.id)) handle.releasePointerCapture(drag.id);
          drag = null;
          document.body.classList.remove('dsa-resizing');
        }
        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);
        handle.addEventListener('lostpointercapture', endDrag);
        handle.addEventListener('keydown', function (e) {
          var m = measure(), total = m.editor + m.term;
          var step = (e.shiftKey ? 0.05 : 0.02) * total;
          var next = null;
          if (e.key === 'ArrowUp') next = m.editor - step;
          else if (e.key === 'ArrowDown') next = m.editor + step;
          else if (e.key === 'Home') next = total * DEFAULT_EDITOR_SHARE;
          else if (e.key === 'End') next = total;
          if (next === null) return;
          e.preventDefault();
          setEditorHeight(next, total);
        });
        handle.addEventListener('dblclick', resetRatio);
      }

      /* --- Load code sent from notes pages --- */
      var storedCode = sessionStorage.getItem('playground-code');
      if (storedCode) {
        editor.value = storedCode;
        sessionStorage.removeItem('playground-code');
      }
    })();
  </script>
</body>

</html>
